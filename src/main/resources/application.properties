spring.application.name=order-analytics-service
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:4000}
server.shutdown=graceful
spring.rabbitmq.addresses=${RABBITMQ_CONNECTION_STRING:amqp://student:LabPassword123@localhost:5672/}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1
# AUTO means Spring acknowledges AFTER the listener returns successfully.
# It is not RabbitMQ's no-ack mode.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# Invalid messages are rejected instead of being retried forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
orders.queue=${ORDER_QUEUE:order_queue}
